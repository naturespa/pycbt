<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>情報I CBT 管理</title><link rel="stylesheet" href="styles.css"></head><body><main class="app-shell admin-shell"><header class="exam-header"><div><span class="header-title">情報I CBT</span><strong>教員管理</strong></div><a href="index.html">受験画面へ</a></header><section id="login-panel" class="card"><h1>教員ログイン</h1><p>初回は教員IDに <code>admin</code>、Cloudflareに登録した初期管理パスワードを入力します。</p><form id="login-form"><label>教員ID<input id="login-id" value="admin" autocomplete="username" required></label><label>パスワード<input id="login-password" type="password" autocomplete="current-password" required></label><button class="primary">ログイン</button></form><p id="login-message" class="hint"></p></section><section id="admin-panel" hidden><div class="admin-actions"><button id="refresh" class="secondary">一覧を更新</button><button id="logout" class="secondary">ログアウト</button></div><section class="card"><h2>受験状況</h2><p class="hint">「再受験を許可」は、その生徒の開始・提出記録を削除します。操作履歴は残ります。</p><div class="table-wrap"><table><thead><tr><th>受験番号</th><th>氏名</th><th>状態</th><th>開始</th><th>提出</th><th></th></tr></thead><tbody id="student-rows"></tbody></table></div></section><section class="card"><h2>担当教員を追加</h2><p class="hint">IDは英数字・ハイフン・アンダースコア3〜32文字、パスワードは12文字以上です。</p><form id="teacher-form" class="teacher-form"><label>教員ID<input id="teacher-id" required></label><label>表示名<input id="teacher-name" required></label><label>パスワード<input id="teacher-password" type="password" minlength="12" required></label><button class="primary">追加</button></form><p id="teacher-message" class="hint"></p><ul id="teacher-list"></ul></section></section></main><script src="admin.js"></script></body></html>
