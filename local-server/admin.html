<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pycbt 成績管理</title>
  <style>
    :root { color-scheme: light; font-family: "Yu Gothic", "Meiryo", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f6fb; color: #172b4d; }
    header { background: #142c50; color: white; padding: 24px max(20px, calc((100vw - 1280px) / 2)); }
    header h1 { margin: 0 0 6px; font-size: 1.65rem; }
    header p { margin: 0; color: #dbe7f8; }
    main { max-width: 1320px; margin: 24px auto; padding: 0 20px 44px; }
    .panel { background: white; border: 1px solid #dbe3ee; border-radius: 12px; padding: 20px; box-shadow: 0 3px 14px #152e5110; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: end; gap: 14px; }
    label { display: grid; gap: 5px; font-weight: 700; }
    label.inline { display: flex; align-items: center; gap: 8px; padding-bottom: 9px; }
    select, button, a.button { font: inherit; border-radius: 7px; padding: 10px 12px; }
    select { border: 1px solid #899cb7; background: white; min-width: 150px; }
    button, a.button { border: 1px solid #204f8e; background: #204f8e; color: white; cursor: pointer; text-decoration: none; }
    button:hover, a.button:hover { background: #163d71; }
    #summary { margin: 18px 0 0; font-weight: 700; }
    #status { margin: 8px 0 0; min-height: 1.4em; }
    #status.error { color: #a11f2a; font-weight: 700; }
    .table-wrap { margin-top: 18px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: white; white-space: nowrap; }
    th, td { border-bottom: 1px solid #dbe3ee; padding: 10px 9px; text-align: left; }
    th { background: #eaf0f8; position: sticky; top: 0; }
    td.score { font-weight: 700; }
    tbody tr:hover { background: #f6faff; }
    .note { color: #4f617c; margin-top: 16px; font-size: .93rem; line-height: 1.7; }
    @media (max-width: 680px) { header { padding: 20px; } main { padding: 0 12px 32px; } }
  </style>
</head>
<body>
  <header><h1>pycbt 成績管理</h1><p>先生PC専用・校内サーバに保存した提出記録</p></header>
  <main>
    <section class="panel">
      <div class="toolbar">
        <label>クラス <select id="class-filter"><option value="">全クラス</option></select></label>
        <label class="inline"><input id="latest-only" type="checkbox" checked>受験番号ごとの最新記録のみ</label>
        <button id="refresh" type="button">再読み込み</button>
        <a id="download" class="button" href="/api/results.csv?latest=1" download>表示中の結果をCSV出力</a>
      </div>
      <p id="summary">読み込み中…</p>
      <p id="status" role="status" aria-live="polite"></p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>受験番号</th><th>クラス</th><th>番号</th><th>氏名</th><th>総合</th><th>知識・技能</th><th>思考・判断・表現</th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>F</th><th>提出時刻</th><th>記録ID</th></tr></thead>
          <tbody id="results"></tbody>
        </table>
      </div>
      <p class="note">同じ受験番号で複数回提出された場合、通常は最後に保存された記録を表示します。再受験の記録を確認する際はチェックを外してください。CSVはExcelで開けるUTF-8形式です。</p>
    </section>
  </main>
  <script>
    "use strict";
    const $ = id => document.getElementById(id);
    let allRows = [];
    function timestamp(value) {
      if (!value) return "";
      const iso = value.includes("T") ? value : value.replace(" ", "T") + "Z";
      const date = new Date(iso);
      return Number.isNaN(date.getTime()) ? value : date.toLocaleString("ja-JP");
    }
    function filteredRows() {
      let rows = allRows;
      if ($("latest-only").checked) {
        const seen = new Set();
        rows = rows.filter(row => {
          if (seen.has(row.student_code)) return false;
          seen.add(row.student_code);
          return true;
        });
      }
      if ($("class-filter").value) rows = rows.filter(row => row.class_name === $("class-filter").value);
      return [...rows].sort((a, b) => a.student_code.localeCompare(b.student_code, "ja") || b.id - a.id);
    }
    function render() {
      const rows = filteredRows();
      const uniqueCount = new Set(allRows.map(row => row.student_code)).size;
      $("summary").textContent = `表示 ${rows.length} 件 ／ 提出済み ${uniqueCount} 人 ／ 全記録 ${allRows.length} 件`;
      const tbody = $("results");
      tbody.replaceChildren();
      for (const row of rows) {
        const cells = [row.student_code, row.class_name, row.attendance, row.student_name,
          row.score, row.knowledge_score, row.thinking_score,
          ..."ABCDEF".split("").map(d => row.domains?.[d] ? `${row.domains[d].earned}/${row.domains[d].max}` : "—"),
          timestamp(row.submitted_at), row.id];
        const tr = document.createElement("tr");
        cells.forEach((value, index) => {
          const td = document.createElement("td");
          td.textContent = value ?? "";
          if (index === 4) td.className = "score";
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      }
      if (!rows.length) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 15;
        td.textContent = "該当する提出記録はありません。";
        tr.appendChild(td);
        tbody.appendChild(tr);
      }
      const query = new URLSearchParams({ latest: $("latest-only").checked ? "1" : "0" });
      if ($("class-filter").value) query.set("class", $("class-filter").value);
      $("download").href = `/api/results.csv?${query}`;
    }
    async function reload() {
      $("status").className = "";
      $("status").textContent = "成績を読み込んでいます…";
      try {
        const response = await fetch("/api/results?latest=0", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (!data.success || !Array.isArray(data.results)) throw new Error("成績データを取得できませんでした");
        allRows = data.results;
        const selected = $("class-filter").value;
        const classes = [...new Set(allRows.map(row => row.class_name).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ja", { numeric: true }));
        $("class-filter").replaceChildren(new Option("全クラス", ""), ...classes.map(name => new Option(name, name)));
        if (classes.includes(selected)) $("class-filter").value = selected;
        $("status").textContent = `更新しました（${new Date().toLocaleTimeString("ja-JP")}）`;
        render();
      } catch (error) {
        $("status").className = "error";
        $("status").textContent = `読み込みに失敗しました：${error.message}`;
      }
    }
    $("class-filter").addEventListener("change", render);
    $("latest-only").addEventListener("change", render);
    $("refresh").addEventListener("click", reload);
    reload();
  </script>
</body>
</html>
