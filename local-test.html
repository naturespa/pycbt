<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>pycbt ローカルサーバ接続テスト</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 18px;
      margin: 10px 0 20px;
    }

    button {
      padding: 12px 24px;
      font-size: 18px;
      cursor: pointer;
    }

    #result {
      margin-top: 25px;
      padding: 20px;
      background: #eee;
      white-space: pre-wrap;
    }

    .success {
      background: #e8f5e9 !important;
    }

    .error {
      background: #ffebee !important;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>pycbt ローカルサーバ接続テスト</h1>

  <p>
    Node.jsを動かしている先生PCのIPv4アドレスを入力してください。
  </p>

  <label for="server-ip">
    先生PCのIPアドレス
  </label>

  <input
    id="server-ip"
    type="text"
    placeholder="例：192.168.1.50"
  >

  <button id="test-button">
    接続テスト
  </button>

  <div id="result">
    ここに結果が表示されます。
  </div>

</div>


<script>

const button = document.getElementById("test-button");
const result = document.getElementById("result");


button.addEventListener("click", async () => {

  const ip =
    document.getElementById("server-ip").value.trim();

  if (!ip) {

    result.className = "error";

    result.textContent =
      "IPアドレスを入力してください。";

    return;
  }


  const url =
    `http://${ip}:3000/api/health`;


  result.className = "";

  result.textContent =
    `接続中...\n\n${url}`;


  try {

    const response = await fetch(url);


    if (!response.ok) {

      throw new Error(
        `HTTPエラー：${response.status}`
      );

    }


    const data = await response.json();


    result.className = "success";

    result.textContent =
      "✅ 接続成功\n\n" +
      JSON.stringify(data, null, 2);


  } catch (error) {

    result.className = "error";

    result.textContent =
      "❌ 接続できませんでした\n\n" +
      "接続先：" + url + "\n\n" +
      "エラー：" + error.message + "\n\n" +
      "確認項目：\n" +
      "・Node.jsサーバが起動しているか\n" +
      "・IPアドレスが正しいか\n" +
      "・Windowsファイアウォール\n" +
      "・校内LANで端末間通信が許可されているか\n" +
      "・ブラウザのローカルネットワークアクセス許可";

    console.error(error);

  }

});

</script>

</body>
</html>
